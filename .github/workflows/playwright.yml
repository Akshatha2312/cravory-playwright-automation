name: Cravory Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Cross-Browser E2E & API Regression
    timeout-minutes: 25
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://cravory-beta.vercel.app' }}
      API_URL: ${{ vars.API_URL || 'https://cravory-mern-ecommerce.onrender.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Run Chromium Full Test Suite
        run: npm run test:chromium

      - name: Run Cross-Browser Smoke & API Suite (Firefox & WebKit)
        run: npm run test:cross-browser

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Failure Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
